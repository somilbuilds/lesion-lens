<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Lesion Lens</title>
  <desc id="d">Explainable deep-learning portal for skin lesion classification and risk triage</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04201f"/>
      <stop offset="0.55" stop-color="#0b4f4a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f4c7a8"/>
      <stop offset="1" stop-color="#d99a76"/>
    </radialGradient>
    <radialGradient id="lesion" cx="0.45" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#a3263a"/>
      <stop offset="0.6" stop-color="#6e1f2c"/>
      <stop offset="1" stop-color="#3d1218"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5eead4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="lens"><circle r="104"/></clipPath>
    <clipPath id="round"><rect width="1280" height="360" rx="22"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      .ecg{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 5s linear infinite}
      @keyframes draw{0%{stroke-dashoffset:1400;opacity:1}70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
      .ring{transform-box:fill-box;transform-origin:center;animation:pulse 3.6s ease-out infinite}
      .ring.r2{animation-delay:1.2s}.ring.r3{animation-delay:2.4s}
      @keyframes pulse{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.5);opacity:0}}
      .scan{animation:scan 4s ease-in-out infinite alternate}
      @keyframes scan{0%{transform:translateY(-96px)}100%{transform:translateY(96px)}}
      .blink{animation:blink 1.6s steps(2,start) infinite}
      @keyframes blink{50%{opacity:0}}
      .float{animation:float 6s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#grid)"/>
    <circle cx="1040" cy="170" r="230" fill="url(#glow)"/>

    <!-- medical crosses -->
    <g fill="#5eead4" fill-opacity="0.16">
      <path d="M96 40h10v10h10v10h-10v10H96V60H86V50h10z" transform="translate(420 -6)"/>
      <path d="M96 40h10v10h10v10h-10v10H96V60H86V50h10z" transform="translate(-40 250) scale(.8)"/>
      <path d="M96 40h10v10h10v10h-10v10H96V60H86V50h10z" transform="translate(820 230) scale(1.2)"/>
    </g>

    <!-- ECG line -->
    <path class="ecg" d="M0 300 H180 l14 0 l10 -22 l12 44 l12 -70 l14 90 l10 -42 H420 l12 0 l10 -18 l10 36 l12 -54 l14 72 l10 -36 H700 l14 0 l10 -22 l12 44 l12 -70 l14 90 l10 -42 H1280"
          fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <path d="M0 300 H1280" stroke="#5eead4" stroke-opacity="0.12" stroke-width="1"/>

    <!-- left content -->
    <g class="sans">
      <g transform="translate(64 62)">
        <rect width="196" height="30" rx="15" fill="#ffffff" fill-opacity="0.1" stroke="#5eead4" stroke-opacity="0.45"/>
        <circle cx="18" cy="15" r="4.5" fill="#5eead4"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
        <text x="32" y="20" font-size="12.5" font-weight="600" letter-spacing="1.4" fill="#ccfbf1">RESEARCH PROTOTYPE</text>
      </g>
      <text x="64" y="160" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-1.5">Lesion Lens</text>
      <text x="66" y="198" font-size="22" fill="#d1fae5" fill-opacity="0.95">Explainable deep learning for skin-lesion classification</text>
      <text x="66" y="226" font-size="22" fill="#d1fae5" fill-opacity="0.95">and risk triage — with the evidence in plain sight.</text>

      <g font-size="13.5" font-weight="600" fill="#ecfdf5">
        <g transform="translate(64 248)"><rect width="128" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/><text x="64" y="20" text-anchor="middle">EfficientNet-B0</text></g>
        <g transform="translate(202 248)"><rect width="92" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/><text x="46" y="20" text-anchor="middle">Grad-CAM</text></g>
        <g transform="translate(304 248)"><rect width="88" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/><text x="44" y="20" text-anchor="middle">ABCDE</text></g>
        <g transform="translate(402 248)"><rect width="90" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/><text x="45" y="20" text-anchor="middle">FastAPI</text></g>
        <g transform="translate(502 248)"><rect width="84" height="30" rx="15" fill="#ffffff" fill-opacity="0.12"/><text x="42" y="20" text-anchor="middle">React</text></g>
      </g>
    </g>

    <!-- right: dermoscope lens -->
    <g transform="translate(1040 160)"><g class="float">
      <circle class="ring" r="120" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <circle class="ring r2" r="120" fill="none" stroke="#2dd4bf" stroke-width="2"/>
      <circle class="ring r3" r="120" fill="none" stroke="#2dd4bf" stroke-width="2"/>

      <circle r="112" fill="#0b2e2c" stroke="#99f6e4" stroke-width="5"/>
      <circle r="104" fill="url(#skin)"/>
      <!-- skin texture -->
      <g stroke="#b9805f" stroke-opacity="0.35" stroke-width="1" fill="none">
        <path d="M-90 -40 q30 -10 60 0 t60 0"/><path d="M-96 30 q30 -10 60 0 t60 0 t40 6"/><path d="M-60 70 q30 -10 60 0 t50 -4"/>
      </g>
      <!-- lesion -->
      <path d="M-4 -52 C26 -62 56 -36 52 -6 C58 24 28 52 -6 50 C-40 54 -60 22 -52 -8 C-58 -34 -30 -48 -4 -52 Z" fill="url(#lesion)"/>
      <path d="M-4 -52 C26 -62 56 -36 52 -6 C58 24 28 52 -6 50 C-40 54 -60 22 -52 -8 C-58 -34 -30 -48 -4 -52 Z" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="7 5">
        <animate attributeName="stroke-dashoffset" values="0;-48" dur="3s" repeatCount="indefinite"/>
      </path>
      <!-- heat spots -->
      <circle cx="-8" cy="-6" r="22" fill="#fb7185" fill-opacity="0.35" filter="url(#soft)"/>
      <circle cx="18" cy="14" r="14" fill="#fbbf24" fill-opacity="0.3" filter="url(#soft)"/>
      <!-- crosshair -->
      <g stroke="#ccfbf1" stroke-opacity="0.8" stroke-width="1.5">
        <path d="M-104 0H-70M70 0H104M0 -104V-70M0 70V104"/>
      </g>
      <!-- scan line -->
      <g clip-path="url(#lens)">
        <g class="scan">
          <rect x="-104" y="-2" width="208" height="4" fill="#5eead4" fill-opacity="0.85"/>
          <rect x="-104" y="-22" width="208" height="22" fill="#5eead4" fill-opacity="0.12"/>
        </g>
      </g>
      <!-- lens handle -->
      <path d="M82 82 L142 142" stroke="#99f6e4" stroke-width="14" stroke-linecap="round"/>
      <path d="M82 82 L142 142" stroke="#0b4f4a" stroke-width="6" stroke-linecap="round"/>
    </g></g>

    <!-- HUD readout -->
    <g class="mono" font-size="12" fill="#99f6e4" transform="translate(590 40)">
      <text>7 classes · 4-view TTA</text>
      <text y="18" fill-opacity="0.75">uncertainty: margin · entropy · agreement</text>
      <text y="36"><tspan>status: awaiting clinician review</tspan><tspan class="blink">_</tspan></text>
    </g>
  </g>
  <rect x="1" y="1" width="1278" height="358" rx="21" fill="none" stroke="#5eead4" stroke-opacity="0.25"/>
</svg>
